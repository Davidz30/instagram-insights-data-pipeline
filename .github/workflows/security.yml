name: Security checks
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m compileall -q src
      - name: Unit tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests
      - name: Dependency vulnerability audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt
      - name: Scan tracked files for exposed secrets
        run: |
          python -m pip install detect-secrets
          detect-secrets scan --all-files --exclude-files '(^|/)\.git/' > /tmp/secrets-report.json
          python - <<'PY'
          import json
          with open('/tmp/secrets-report.json', encoding='utf-8') as f:
              results = json.load(f)['results']
          for name, findings in results.items():
              print(f"{name}: {len(findings)} potential secrets")
          if results:
              raise SystemExit('Potential secrets detected; review before publication')
          PY
      - name: Static security audit
        run: |
          python -m pip install bandit
          bandit -r src -ll
